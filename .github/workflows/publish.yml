name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish cntryl-lexkey to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches crate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys
          metadata = json.load(sys.stdin)
          packages = [package for package in metadata["packages"] if package["name"] == "cntryl-lexkey"]
          if len(packages) != 1:
              raise SystemExit("expected exactly one cntryl-lexkey package")
          print(packages[0]["version"])
          ')"
          test "${RELEASE_TAG}" = "v${version}"

      - name: Verify package contents
        run: cargo package --locked

      - name: Test workspace
        run: cargo test --locked --all-targets --all-features

      - name: Check format and lints
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish cntryl-lexkey
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
