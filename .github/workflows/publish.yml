name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish cntryl-lexkey to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Require main branch dispatch
        run: |
          test "${GITHUB_REF_TYPE}" = "branch"
          test "${GITHUB_REF_NAME}" = "main"

      - name: Read crate version from Cargo.toml
        id: crate
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "cntryl-lexkey") | .version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: cargo package --locked

      - name: Test workspace
        run: cargo test --locked --all-targets --all-features

      - name: Check format and lints
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish cntryl-lexkey
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Tag published version
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          tag="v${CRATE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "${tag}^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "${tag}" HEAD
            git push origin "refs/tags/${tag}"
          fi
